[tool.ruff]
target-version = "py39"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "E501", # long lines in report templates are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM"]
